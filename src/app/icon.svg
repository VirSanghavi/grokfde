  <circle cx="16" cy="26.4" r="2" fill="#FBFAF9"/>
  <circle cx="5.6" cy="16" r="2" fill="#FBFAF9"/>
  <circle cx="16" cy="16" r="5.4" fill="#D6401F"/>
</svg>
